{% macro view_nav(current_view) -%}
<nav class="app-view-nav" aria-label="Application views">
  <a id="focus-view-link" class="app-view-link app-view-link-icon" href="{{ url_for('index', view='focus') }}" data-app-view="focus" data-task-view="focus" aria-label="{{ 'Focused' if current_view == 'focus' else 'Switch to Focused' }}"{% if current_view == 'focus' %} aria-current="page"{% endif %}>
    <span class="app-view-link-prompt" aria-hidden="true"><span class="app-view-prompt-action">Switch to Focused</span><span class="app-view-prompt-current">Focused</span></span>
    <svg class="app-view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
      <circle cx="12" cy="12" r="2.5"></circle>
    </svg>
  </a>
  <a id="manage-view-link" class="app-view-link app-view-link-icon" href="{{ url_for('index', view='manage') }}" data-app-view="manage" data-task-view="manage" aria-label="{{ 'All Tasks' if current_view == 'manage' else 'Switch to All Tasks' }}"{% if current_view == 'manage' %} aria-current="page"{% endif %}>
    <span class="app-view-link-prompt" aria-hidden="true"><span class="app-view-prompt-action">Switch to All Tasks</span><span class="app-view-prompt-current">All Tasks</span></span>
    <svg class="app-view-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path>
    </svg>
  </a>
  <a id="agent-view-link" class="app-view-link app-view-link-icon" href="{{ url_for('index', view='agent') }}" data-app-view="agent" aria-label="{{ 'Agent' if current_view == 'agent' else 'Switch to Agent' }}"{% if current_view == 'agent' %} aria-current="page"{% endif %}>
    <span class="app-view-link-prompt" aria-hidden="true"><span class="app-view-prompt-action">Switch to Agent</span><span class="app-view-prompt-current">Agent</span></span>
    <svg class="app-view-icon chat-bubble-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4Z"></path>
    </svg>
    <span id="agent-update-badge" class="agent-update-badge" aria-hidden="true" hidden>
      <svg viewBox="0 0 16 16" focusable="false">
        <path d="M8 1.5 15 14H1L8 1.5Z"></path>
        <path d="M8 5v4.5M8 12v.01"></path>
      </svg>
    </span>
  </a>
  <span id="view-navigation-lock-message" class="view-navigation-lock-message" role="status" aria-live="polite" hidden>
    <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="3.5" y="7" width="9" height="7" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg>
    <span id="view-navigation-lock-copy">Finish editing to switch views</span>
  </span>
</nav>
{%- endmacro %}
