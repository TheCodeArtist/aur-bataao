[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aur-bataao"
version = "0.1.0"
description = "A compact single-user task tracker"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "openai>=3.16,<4",
  "tzdata>=2025.2",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
  "pytest-cov>=7,<8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-config", "--strict-markers"]
xfail_strict = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["."]
omit = [
  "tests/*",
  ".venv/*",
  ".githooks/*",
]

[tool.coverage.report]
fail_under = 95
precision = 2
show_missing = true
skip_empty = true

[tool.setuptools]
py-modules = [
  "agent_store",
  "agent_tools",
  "agent_runner",
  "app",
  "llm_profiles",
  "llm_provider",
  "task_service",
]
