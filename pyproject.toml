[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aur-bataao"
version = "0.1.0"
description = "A compact single-user task tracker"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "openai>=3.16,<4",
  "tzdata>=2025.2",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
py-modules = ["app", "llm_provider", "task_service"]
